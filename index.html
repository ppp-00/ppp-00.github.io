<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ppp-00 のサイト</title>
<style>
:root{--bg:#f4f2ee;--card:#fffdf9;--fg:#1f2421;--muted:#6b706b;--line:#e2ded6;--accent:#2f6f5e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151816;--card:#1d211f;--fg:#e8ebe8;--muted:#9aa39d;--line:#2c322f;--accent:#7cc4ad;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
main{max-width:520px;margin:0 auto;padding-block:48px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.4rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 28px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
.icon{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.txt{min-width:0;flex:1}
.name{font-weight:600}
.desc{color:var(--muted);font-size:.85rem}
.arrow{color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:.78rem}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>ppp-00 のサイト</h1>
<p class="sub">自作サイトへのリンク集</p>
<ul id="list"></ul>
<footer>リンクの追加・変更は <a href="https://github.com/ppp-00/ppp-00.github.io/edit/main/index.html">index.html の SITES</a> を編集</footer>
</main>
<script>
// ここにサイトを追加する： { name, desc, url, icon }
const SITES = [
  { name: "長崎の住まい比較", desc: "物件と通勤バス（岩瀬道町）の比較", url: "https://ppp-00.github.io/nagasaki-rent/", icon: "🏠" },
  { name: "買い目検索", desc: "ボートレースの買い目検索", url: "https://ppp-00.github.io/boat_site/", icon: "🚤" },
];
const list = document.getElementById("list");
for (const s of SITES) {
  const li = document.createElement("li");
  li.innerHTML = '<a class="card"><span class="icon"></span><span class="txt"><div class="name"></div><div class="desc"></div></span><span class="arrow">›</span></a>';
  const a = li.querySelector("a"); a.href = s.url;
  li.querySelector(".icon").textContent = s.icon || "🔗";
  li.querySelector(".name").textContent = s.name;
  li.querySelector(".desc").textContent = s.desc || "";
  list.appendChild(li);
}
</script>
</body>
</html>
